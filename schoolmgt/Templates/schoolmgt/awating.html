<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awaiting Account Approval</title>
</head>

<body
    style="margin: 0; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #4e73df, #1cc88a); color: #ffffff;">
    <div
        style="text-align: center; max-width: 600px; padding: 20px; background-color: rgba(0, 0, 0, 0.6); border-radius: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 1px;">Awaiting Account Approval</h1>
        <p style="font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6;">
            Thank you for registering with us. Your account is currently under review. We aim to process approvals as
            quickly as possible. Please check your email for further updates.
        </p>
        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <div
                style="width: 50px; height: 50px; border: 6px solid rgba(255, 255, 255, 0.3); border-top: 6px solid #ffffff; border-radius: 50%; animation: spin 1s linear infinite;">
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
